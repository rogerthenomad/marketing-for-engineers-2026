name: Check links

# Link rot is the thing that kills a list like this. This runs monthly, on every
# PR that touches markdown, and on demand — and opens an issue when links die.

on:
  schedule:
    # 09:00 UTC on the 1st of each month
    - cron: "0 9 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --accept 429 matters: several sites here rate-limit CI runners and
          # would otherwise be reported as broken.
          # --accept 403 covers sites that block datacenter IPs (Cloudflare et al).
          args: >-
            --no-progress
            --cache
            --max-cache-age 14d
            --max-concurrency 8
            --timeout 30
            --max-retries 2
            --accept 200,206,403,429
            --exclude-mail
            './**/*.md'
          fail: false
          jobSummary: true

      - name: Open an issue if links are dead
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links found by the monthly check"
          content-filepath: ./lychee/out.md
          labels: link-rot, maintenance

      - name: Fail the PR if it introduced dead links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          echo "::error::lychee found broken links. See the job summary for details."
          echo "If a link is a false positive (rate limiting, bot blocking), add it to .lycheeignore."
          exit 1
